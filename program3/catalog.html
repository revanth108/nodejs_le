<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Simple E-Commerce</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-dark text-white text-center py-4 mb-4">
        <div class="container">
            <h1>Catalog</h1>
            <nav class="mt-3">
                <ul class="nav justify-content-center">
                    <li class="nav-item"><a class="nav-link text-white" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <h2 class="mb-4 text-center">Our Products</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title h5">Product 1</h3>
                        <p class="card-text">Description of Product 1</p>
                        <p class="text-muted fw-bold">$10.00</p>
                        <button class="btn btn-primary" onclick="addToCart('Product 1', 10.00)">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title h5">Product 2</h3>
                        <p class="card-text">Description of Product 2</p>
                        <p class="text-muted fw-bold">$15.00</p>
                        <button class="btn btn-primary" onclick="addToCart('Product 2', 15.00)">Add to Cart</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title h5">Product 3</h3>
                        <p class="card-text">Description of Product 3</p>
                        <p class="text-muted fw-bold">$20.00</p>
                        <button class="btn btn-primary" onclick="addToCart('Product 3', 20.00)">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 bg-white border-top mt-5">
        <p class="text-muted mb-0">&copy; 2023 Simple E-Commerce Site</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function addToCart(name, price) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            const existingProduct = cart.find(item => item.name === name);
            if (existingProduct) {
                existingProduct.quantity += 1;
            } else {
                cart.push({ name: name, price: price, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            alert(`${name} has been added to your cart!`);
        }
    </script>
</body>
</html>
