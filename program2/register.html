<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Simple E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-dark text-white text-center py-4 mb-4">
        <div class="container">
            <h1>Register[cite: 5]</h1>
            <nav class="mt-3">
                <ul class="nav justify-content-center">
                    <li class="nav-item"><a class="nav-link text-white" href="home.html">Home[cite: 5]</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="catalog.html">Catalog[cite: 5]</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="cart.html">Cart[cite: 5]</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="login.html">Login[cite: 5]</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-5" style="max-width: 400px;">
        <h2 class="mb-4 text-center">Create a New Account[cite: 5]</h2>
        <form action="RegisterServlet" method="GET" class="card p-4 shadow-sm bg-white">
            <div class="mb-3">
                <label for="username" class="form-label">Username[cite: 5]:</label>
                <input type="text" id="username" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email[cite: 5]:</label>
                <input type="email" id="email" name="mail" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password[cite: 5]:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register[cite: 5]</button>
        </form>
    </main>

    <footer class="text-center py-4 bg-white border-top mt-auto">
        <p class="text-muted mb-0">&copy; 2023 Simple E-Commerce Site[cite: 5]</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
