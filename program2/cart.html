<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Simple E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="bg-dark text-white text-center py-4 mb-4">
        <div class="container">
            <h1>Shopping Cart</h1>
            <nav class="mt-3">
                <ul class="nav justify-content-center">
                    <li class="nav-item"><a class="nav-link text-white" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="catalog.html">Catalog</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="cart.html">Cart</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <h2 class="mb-4 text-center">Your Cart Items</h2>
        <div class="card shadow-sm p-4 bg-white">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col">Price</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Product 1</td>
                            <td>$10.00</td>
                            <td>1</td>
                            <td><button class="btn btn-sm btn-danger">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <a href="catalog.html" class="btn btn-secondary">Continue Shopping</a>
                <button class="btn btn-success">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 bg-white border-top mt-5">
        <p class="text-muted mb-0">&copy; 2023 Simple E-Commerce Site</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
